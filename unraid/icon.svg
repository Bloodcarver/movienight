<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2a66"/>
      <stop offset="1" stop-color="#16111f"/>
    </linearGradient>
    <linearGradient id="pop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset="1" stop-color="#f5d27a"/>
    </linearGradient>
    <clipPath id="bucketClip">
      <path d="M232 250 L432 250 L404 466 L260 466 Z"/>
    </clipPath>
  </defs>

  <!-- Bakgrund -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- Filmklappa -->
  <g transform="translate(70 196) rotate(-8)">
    <!-- tavla -->
    <rect x="0" y="62" width="230" height="170" rx="14" fill="#1d1d24" stroke="#f3eff9" stroke-width="6"/>
    <line x1="22" y1="128" x2="208" y2="128" stroke="#f3eff9" stroke-width="5" opacity=".55"/>
    <line x1="22" y1="172" x2="150" y2="172" stroke="#f3eff9" stroke-width="5" opacity=".55"/>
    <!-- nedre randig list -->
    <g>
      <rect x="0" y="22" width="230" height="40" rx="6" fill="#f3eff9"/>
      <path d="M18 22 L52 22 L34 62 L0 62 L0 52 Z M86 22 L120 22 L102 62 L68 62 Z M154 22 L188 22 L170 62 L136 62 Z M222 22 L230 22 L230 42 L238 62 L204 62 Z" fill="#1d1d24"/>
    </g>
    <!-- öppen klappa -->
    <g transform="translate(4 18) rotate(-20)">
      <rect x="0" y="-40" width="230" height="40" rx="6" fill="#f3eff9"/>
      <path d="M22 -40 L56 -40 L38 0 L4 0 Z M90 -40 L124 -40 L106 0 L72 0 Z M158 -40 L192 -40 L174 0 L140 0 Z" fill="#1d1d24"/>
    </g>
    <circle cx="8" cy="22" r="9" fill="#f5b942"/>
  </g>

  <!-- Popcorn ovanpå hinken -->
  <g fill="url(#pop)" stroke="#e0b24e" stroke-width="3">
    <circle cx="258" cy="236" r="34"/>
    <circle cx="300" cy="206" r="38"/>
    <circle cx="352" cy="200" r="38"/>
    <circle cx="400" cy="230" r="34"/>
    <circle cx="282" cy="250" r="30"/>
    <circle cx="332" cy="238" r="34"/>
    <circle cx="384" cy="252" r="30"/>
    <circle cx="326" cy="166" r="30"/>
  </g>

  <!-- Hink -->
  <g clip-path="url(#bucketClip)">
    <rect x="220" y="250" width="230" height="230" fill="#f3eff9"/>
    <rect x="236" y="250" width="30" height="230" fill="#e2384f"/>
    <rect x="296" y="250" width="30" height="230" fill="#e2384f"/>
    <rect x="356" y="250" width="30" height="230" fill="#e2384f"/>
    <rect x="416" y="250" width="30" height="230" fill="#e2384f"/>
  </g>
  <path d="M232 250 L432 250 L404 466 L260 466 Z" fill="none" stroke="#b81f36" stroke-width="5" stroke-linejoin="round"/>
  <rect x="222" y="240" width="220" height="22" rx="11" fill="#e2384f" stroke="#b81f36" stroke-width="4"/>
  <!-- Stjärna på hinken -->
  <path d="M332 330 l11 23 25 3 -18 17 5 25 -23 -12 -23 12 5 -25 -18 -17 25 -3 z" fill="#f5b942" stroke="#b8862a" stroke-width="3" stroke-linejoin="round"/>
</svg>
